services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hotel-cms-db
    environment:
      POSTGRES_DB: hotel_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-cms-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-cms-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hotel_cms
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: q8K7v9pT4zL2mW1xY0bR5nH6sF3dJ8uE
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - hotel-cms-network
    command: npm run dev

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel-cms-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - hotel-cms-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  hotel-cms-network:
    driver: bridge
